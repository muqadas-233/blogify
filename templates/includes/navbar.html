<nav class="navbar navbar-expand-lg navbar-dark main-navbar shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'blog:post_list' %}">
      Blogify
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.url_name == 'post_list' %} active{% endif %}"
             href="{% url 'blog:post_list' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'blog:author_dashboard' %}">Dashboard</a>
        </li>
      </ul>

      <form class="d-flex me-3" role="search" method="get" action="{% url 'blog:post_search' %}">
        <input class="form-control form-control-sm me-2" type="search" placeholder="Search..."
               aria-label="Search" name="q" value="{{ request.GET.q }}">
        <button class="btn btn-sm btn-outline-light" type="submit">Search</button>
      </form>

      <ul class="navbar-nav mb-2 mb-lg-0">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <span class="navbar-text me-2">Hi, {{ user.username }}</span>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-outline-light me-2"
               href="{% url 'blog:post_create' %}">New Post</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-light" href="{% url 'accounts:logout' %}">Logout</a>
          </li>
        {% else %}
          <li class="nav-item me-2">
            <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:login' %}">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-light" href="{% url 'accounts:register' %}">Register</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
